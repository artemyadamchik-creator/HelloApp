name: MyNewApp
options:
  bundleIdPrefix: com.hello
  deploymentTarget:
    iOS: "14.0"
targets:
  MyNewApp:
    type: application
    platform: iOS
    sources: [.]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hello.mynewapp
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MyNewApp
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
